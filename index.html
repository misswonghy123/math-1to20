<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGebra 數學互動課件</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .geogebra-container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>📐 GeoGebra 互動幾何課件</h1>
  <p>拖曳圖形中的點，觀察數值變化：</p>

  <div class="geogebra-container">
    <!-- 將您在 GeoGebra 複製的 iframe 貼在這裡 -->
<iframe scrolling="no" title="兩位數的位值" src="https://www.geogebra.org/material/iframe/id/cmhdujfg/width/1000/height/500/border/888888/sfsb/true/smb/false/stb/false/stbh/false/ai/false/asb/false/sri/true/rc/false/ld/false/sdz/false/ctl/false" width="1000px" height="500px" style="border:0px;"> </iframe>
    <iframe src="https://www.geogebra.org/material/iframe/id/mcdru3sc/width/800/height/500/border/888888/sfsb/true/smb/false/stb/false/stbh/false/ai/true/asb/true/sri/false/rc/false/ld/false/sdz/true/ctl/false" allowfullscreen></iframe>
  </div>

</body>
</html>
